name: Build Android App

# Builds APK only — does NOT deploy Cloudflare or touch live data.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fill missing platform files
        run: flutter create . --platforms=android --org com.baraha

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          URL="${API_BASE_URL:-https://barahamess-2025.ibrahimhumayun0614.workers.dev}"
          flutter build apk --release --dart-define=API_BASE_URL=$URL

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baraha-mess-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
